[project]
name = "dealdirection"
version = "0.1.0"
description = "DealDirection MVP: grocery cart optimiser, receipt scanning and points"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt",
    "fastapi",
    "httpx",
    "beautifulsoup4",
    "opencv-python-headless",
    "pillow",
    "psycopg[binary]",
    "pydantic-settings",
    "pyjwt",
    "pypdf",
    "pypdfium2",
    "pytesseract",
    "python-multipart",
    "pyyaml",
    "rapidfuzz",
    "sqlalchemy",
    "uvicorn[standard]",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.31.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installs `app` and `dealdata` so both import under `uv run` and pytest.
[tool.hatch.build.targets.wheel]
packages = ["backend/app", "data/dealdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "data"]
