        sizes: ["135 g", "150 g", "168 g", "193 g", "200 g", "210 g", "250 g", "250 ml"]
      - name: Alte sortimente
        any_of: [ciocolata, milka]
        exclude: [napolitana, biscuiti, bautura, inghetata, praf, batoane, baton, cereale, fulgi, crema, tartinabila]
