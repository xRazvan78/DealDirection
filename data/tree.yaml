        sizes: ["450 ml", "500 ml", "1 l", "1.5 l", "1.8 l"]
      - name: "1.5%"
        starts_with: [lapte]
        include: [lapte, "1.5%"]
        exclude: [curatare, demachiant, corp, bebe, praf, condensat, ciocolata, cacao, soia, ovaz, migdale, capra]
        aliases: [lapte degresat]
        sizes: ["200 ml", "500 ml", "1 l", "1.5 l", "1.8 l"]
      - name: Ovăz
        include: [bautura, ovaz]
        exclude: [ciocolata, cacao]
        aliases: [lapte de ovaz, bautura de ovaz]
        sizes: ["1 l"]
      - name: Capră
        starts_with: [lapte]
        include: [lapte, capra]
        exclude: [praf, branza, sapun, cascaval]
        sizes: ["1 l"]
      - name: Condensat
        starts_with: [lapte]
        include: [lapte, condensat]
        sizes: ["410 g"]
      - name: Alte tipuri
        starts_with: [lapte]
        include: [lapte]
        exclude: [curatare, demachiant, corp, bebe, ciocolata, cacao, crestere, orez, gris, cascaval, branza, sapun, sampon, masca, crema, hidratant, ten, fata]
        sizes: ["200 ml", "1 l"]

  - name: Ouă
    group: Lactate și ouă
    types:
      - name: Găini
        starts_with: [oua]
        include: [oua]
        exclude: [ciocolata, prepelita]
        aliases: [oua, ou]
        sizes: ["6 buc", "8 buc", "10 buc", "15 buc", "20 buc", "30 buc"]
      - name: Prepeliță
        starts_with: [oua]
        include: [oua, prepelita]
        exclude: [ciocolata]
