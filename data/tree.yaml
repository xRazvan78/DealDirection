# Hand-checked group -> category -> type -> size tree. Owner: Member 1, Task 4.
#
# Filled in from the first real scrape, so each entry in `sizes` is a pack that exists.
# A leaf with products at only one store can't be compared between stores.
#
# Each entry in `sizes` becomes one size-level leaf.
# `group`, `name` and `sizes` are shown to the client, so they keep their Romanian spelling.
# `include`, `any_of`, `starts_with`, `exclude` and `aliases` are compared with folded
# text, so write them in lowercase with no diacritics. Every `include` word must appear
# in a product name, at least one `any_of` word must appear if there are any, the name
# must begin with a `starts_with` entry if there are any, and no `exclude` word may
# appear. `aliases` map imported foods to this leaf.
#
# classify() takes the first rule that matches, so ORDER MATTERS: specific forms such as
# chocolate or frozen food come before plain ingredients such as milk or bananas.

categories:
  - name: Hrană bebeluși
    group: Bebeluși
    types:
      - name: Lapte de creștere
        include: [lapte]
        any_of: [crestere, formula, praf, luni, hipp, aptamil, nutrino, humana, milupa]
        sizes: ["130 g", "250 g", "700 g"]
      - name: Piure
        include: [piure]
        sizes: ["90 g", "100 g", "120 g", "125 g", "160 g", "180 g", "190 g", "200 g", "400 g", "500 g", "600 g"]
      - name: Cereale și gustări
        any_of: [hipp, nutrino, baby, bebelusi, luni, mousse, an]
        exclude: [lapte, sampon, servetele, pulpe, piept, pui]
        sizes: ["22 buc", "60 buc", "23 g", "28 g", "35 g", "100 g", "102 g", "120 g", "190 g", "200 g", "250 g", "400 g", "120 ml", "200 ml", "250 ml", "500 ml", "1 l", "1.5 l", "1.8 l", "3.1 l"]

  - name: Înghețată
    group: Congelate
    types:
      - name: Înghețată
        any_of: [inghetata]
        sizes: ["39 g", "480 g", "900 g", "90 ml", "140 ml", "270 ml", "301 ml", "302 ml", "440 ml", "460 ml", "465 ml", "470 ml", "480 ml", "500 ml", "660 ml", "1 l", "1.4 l"]

  - name: Legume congelate
    group: Congelate
    types:
      - name: Legume
        any_of: [congelat, congelata, congelate]
        exclude: [cartofi, pizza, fructe, peste, pui]
        sizes: ["500 g"]

  - name: Cartofi congelați
    group: Congelate
    types:
      - name: Cartofi prăjiți
        include: [cartofi]
        any_of: [congelati, prajiti, pai, wedges, aviko, mccain]
        sizes: ["400 g", "450 g", "600 g", "750 g", "1 kg", "1.6 kg", "2.5 kg"]

  - name: Semipreparate congelate
    group: Congelate
    types:
      - name: Pizza
        any_of: [pizza]
        sizes: ["300 g", "500 g", "750 g", "1 kg"]
      - name: Patiserie
        any_of: [foietaj, placinta, clatite, pancakes, gogosi, covrigi]
        sizes: ["125 g", "200 g", "250 g", "350 g", "400 g", "500 g", "650 g", "800 g"]
      - name: Pane și crispy
        any_of: [pane, crispy, nuggets, snitel]
        sizes: ["70 g", "200 g", "210 g", "320 g", "350 g", "500 g", "1 kg"]

  - name: Ciocolată
    group: Dulciuri și snacks
    types:
      - name: Cu lapte
        include: [ciocolata, lapte]
        exclude: [napolitana, biscuiti, bautura, inghetata, praf]
        aliases: [ciocolata, ciocolata cu lapte]
        sizes: ["8 buc", "20 g", "25 g", "35 g", "40 g", "42 g", "70 g", "80 g", "85 g", "90 g", "95 g", "100 g", "120 g", "145 g", "148 g", "150 g", "160 g", "190 g", "196 g", "200 g", "240 g", "250 g", "300 g", "337 g", "500 ml"]
      - name: Neagră
        include: [ciocolata, neagra]
        exclude: [napolitana, biscuiti, bautura, inghetata, praf]
        aliases: [ciocolata neagra]
        sizes: ["27 g", "35 g", "40 g", "42 g", "45 g", "50 g", "75 g", "80 g", "85 g", "100 g", "120 g", "125 g", "140 g", "150 g", "200 g", "1 kg"]
      - name: Albă
        include: [ciocolata, alba]
        exclude: [napolitana, biscuiti, bautura]
        sizes: ["80 g", "90 g", "145 g", "150 g"]
      - name: Praline
        any_of: [praline, trufe]
