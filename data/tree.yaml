# Hand-checked group -> category -> type -> size tree. Owner: Member 1, Task 4.
#
# Filled in from the first real scrape, so each entry in `sizes` is a pack that exists.
# A leaf with products at only one store can't be compared between stores.
#
# Each entry in `sizes` becomes one size-level leaf.
# `group`, `name` and `sizes` are shown to the client, so they keep their Romanian spelling.
# `include`, `any_of`, `starts_with`, `exclude` and `aliases` are compared with folded
# text, so write them in lowercase with no diacritics. Every `include` word must appear
# in a product name, at least one `any_of` word must appear if there are any, the name
# must begin with a `starts_with` entry if there are any, and no `exclude` word may
# appear. `aliases` map imported foods to this leaf.
#
# classify() takes the first rule that matches, so ORDER MATTERS: specific forms such as
# chocolate or frozen food come before plain ingredients such as milk or bananas.

categories:
  - name: Hrană bebeluși
    group: Bebeluși
    types:
      - name: Lapte de creștere
        include: [lapte]
        any_of: [crestere, formula, hipp, aptamil, nutrino, humana, milupa]
        aliases: [hrana bebelusi lapte de crestere]
        sizes: ["700 g"]
      - name: Piure
        include: [piure]
        aliases: [hrana bebelusi piure]
        sizes: ["90 g", "100 g", "120 g", "125 g", "160 g", "180 g", "190 g", "200 g", "400 g", "500 g", "600 g"]
      - name: Cereale și gustări
        any_of: [hipp, nutrino, baby, bebelusi, luni, mousse, an]
        exclude: [lapte, sampon, servetele, pulpe, piept, pui, apa, lotiune, balsam, crema]
        aliases: [hrana bebelusi cereale si gustari]
        sizes: ["22 buc", "60 buc", "23 g", "28 g", "35 g", "100 g", "102 g", "120 g", "190 g", "200 g", "250 g", "400 g", "120 ml", "1.5 l", "1.8 l"]

