        sizes: ["200 ml", "250 ml", "500 ml"]

  - name: Brânză
    group: Lactate și ouă
    types:
      - name: Telemea
        include: [telemea]
        exclude: [topita, felii]
        aliases: [telemea, branza telemea]
        sizes: ["150 g", "200 g", "300 g", "350 g", "400 g", "500 g", "800 g", "1 kg"]
