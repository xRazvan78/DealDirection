        include: [iaurt]
        any_of: [baut, bautura]
        sizes: ["320 g", "350 g", "490 g"]

  - name: Unt
    group: Lactate și ouă
    types:
      - name: Unt
        starts_with: [unt, margarina]
        include: [unt]
        exclude: [arahide, cacao, corp, planta, ras]
        aliases: [unt]
        sizes: ["200 g"]

  - name: Smântână
    group: Lactate și ouă
    types:
