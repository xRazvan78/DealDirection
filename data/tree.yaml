  - name: Bere
    types:
      - name: Blondă
        include: [bere, blonda]
        exclude: [fara, pahar, sampon]
        sizes: ["500 ml"]
        aliases: [bere]

  - name: Ciocolată
    types:
      - name: Cu lapte
        include: [ciocolata, lapte]
        exclude: [napolitana, biscuiti, bautura, inghetata, praf]
        sizes: ["100 g"]
        aliases: [ciocolata, ciocolata cu lapte]
      - name: Neagră
        include: [ciocolata, neagra]
        exclude: [napolitana, biscuiti, bautura, inghetata, praf]
