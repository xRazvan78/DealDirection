  - name: Carne de pui
    types:
      - name: Piept
        include: [piept, pui]
        exclude: [hrana, pisici, caini, afumat, pate, sunca]
        sizes: ["500 g", "1 kg"]
        aliases: [piept de pui, carne de pui]
      - name: Pulpe
        include: [pulpe, pui]
