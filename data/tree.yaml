        sizes: ["150 g", "175 g", "190 g", "200 g", "250 g", "300 g", "325 g", "350 g", "380 g", "400 g", "450 g", "480 g", "500 g", "600 g", "750 g", "850 g"]
      - name: Cremă de brânză
        include: [crema, branza]
