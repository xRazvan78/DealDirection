        sizes: ["1 kg", "2 kg"]
        aliases: [cartofi]

  - name: Ceapă
    types:
      - name: Galbenă
        include: [ceapa]
        exclude: [rosie, verde, pudra, praf, chips]
        sizes: ["1 kg"]
        aliases: [ceapa]

  - name: Banane
    types:
      - name: Banane
        include: [banane]
