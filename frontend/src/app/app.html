@if (showNavigation()) {
  <header class="top-bar">
    <span class="brand">{{ ro.appName }}</span>
    <nav class="top-links">
      <a routerLink="/lists">{{ ro.nav.lists }}</a>
      <a routerLink="/wallet">{{ ro.nav.wallet }}</a>
      <a routerLink="/settings">{{ ro.nav.settings }}</a>
    </nav>
  </header>
}

<main class="content">
  <router-outlet />
</main>

@if (showNavigation()) {
  <nav class="bottom-nav">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="active">
        <!-- Placeholder icons, until the final design arrives. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @switch (tab.icon) {
            @case ('deals') {
              <path d="M6 18 18 6" />
              <circle cx="7.5" cy="7.5" r="2.5" />
              <circle cx="16.5" cy="16.5" r="2.5" />
            }
            @case ('cart') {
              <path d="M3 4h2.5l2.2 11h10.1l2-8H6.3" />
              <circle cx="9" cy="19" r="1.5" />
              <circle cx="16" cy="19" r="1.5" />
            }
            @case ('cards') {
              <rect x="3" y="11" width="18" height="10" rx="2" />
              <path d="M5 11V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2" />
              <path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2" />
            }
          }
        </svg>
        {{ tab.label }}
      </a>
    }
  </nav>
}
